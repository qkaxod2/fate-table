name: Media smoke

# 배포된 그림 함수(media-prompt · media-image)를 실제로 불러 본다 (수동 실행)
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/e2e/media.mjs', '.github/workflows/media-smoke.yml']

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save @supabase/supabase-js@2 sharp@0.34
      - run: node scripts/e2e/media.mjs
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media
          path: out/media
