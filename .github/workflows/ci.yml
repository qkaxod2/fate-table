name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: 공용 번들 최신 여부
        run: pnpm bundle:shared && git diff --exit-code supabase/functions/_shared

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: for f in media-image media-prompt rooms join commands account leave close; do (cd supabase/functions/$f && deno check index.ts) || exit 1; done
      - name: deno test
        working-directory: supabase/functions
        run: deno test --config commands/deno.json _shared/quota.test.ts commands/handle.test.ts
