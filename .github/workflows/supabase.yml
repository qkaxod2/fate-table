name: Supabase

# main에 supabase/ 가 바뀌면 DB 마이그레이션 → 함수 시크릿 → Edge Function 배포 순서로 반영한다.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
      - name: 함수 시크릿
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" NAI_API_KEY="$NAI_API_KEY"
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY"
          fi
          # 프롬프트 도우미(Vertex AI Gemini): API 키나 서비스 계정 JSON 중 하나만 있으면 된다
          for name in VERTEX_API_KEY GOOGLE_SERVICE_ACCOUNT_JSON GOOGLE_CLOUD_PROJECT VERTEX_LOCATION VERTEX_MODEL; do
            if [ -n "${!name}" ]; then
              supabase secrets set --project-ref "$PROJECT_REF" "$name=${!name}"
            fi
          done
        env:
          NAI_API_KEY: ${{ secrets.NAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
          VERTEX_MODEL: ${{ vars.VERTEX_MODEL }}
      - name: 익명 로그인 켜기
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d '{"external_anonymous_users_enabled": true}')
          echo "auth config: $code"
          test "$code" = 200
      - run: supabase functions deploy --project-ref "$PROJECT_REF"
