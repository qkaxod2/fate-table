name: Supabase

# main에 supabase/ 가 바뀌면 DB 마이그레이션 → 함수 시크릿 → Edge Function 배포 순서로 반영한다.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
      - name: 함수 시크릿
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" NAI_API_KEY="$NAI_API_KEY"
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY"
          fi
          # 프롬프트 도우미(Vertex AI Gemini): API 키나 서비스 계정 JSON 중 하나만 있으면 된다
          for name in VERTEX_API_KEY GOOGLE_SERVICE_ACCOUNT_JSON GOOGLE_CLOUD_PROJECT VERTEX_LOCATION VERTEX_MODEL; do
            if [ -n "${!name}" ]; then
              supabase secrets set --project-ref "$PROJECT_REF" "$name=${!name}"
            fi
          done
        env:
          NAI_API_KEY: ${{ secrets.NAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
          VERTEX_MODEL: ${{ vars.VERTEX_MODEL }}
      - name: 로그인 설정 (익명 · 이메일 · 구글)
        run: |
          # 이메일 확인 메일은 직접 SMTP를 붙였을 때만 켠다 (기본 메일 서버는 팀원에게만 보내진다)
          autoconfirm=true
          if [ "$AUTH_EMAIL_CONFIRM" = "true" ]; then autoconfirm=false; fi
          body=$(jq -n \
            --arg site "$SITE_URL" \
            --arg allow "$SITE_URL**,http://localhost:3000/**" \
            --argjson autoconfirm "$autoconfirm" \
            '{external_anonymous_users_enabled: true,
              security_manual_linking_enabled: true,
              external_email_enabled: true,
              mailer_autoconfirm: $autoconfirm,
              password_min_length: 8,
              site_url: $site,
              uri_allow_list: $allow}')
          if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ] && [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            body=$(echo "$body" | jq --arg id "$GOOGLE_OAUTH_CLIENT_ID" --arg secret "$GOOGLE_OAUTH_CLIENT_SECRET" \
              '. + {external_google_enabled: true, external_google_client_id: $id, external_google_secret: $secret}')
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d "$body")
          echo "auth config: $code"
          test "$code" = 200
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          AUTH_EMAIL_CONFIRM: ${{ vars.AUTH_EMAIL_CONFIRM }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      - run: supabase functions deploy --project-ref "$PROJECT_REF"
